name: tavuel_app
description: Tavuel - Home services platform connecting customers with trusted service providers in Bogota, Colombia.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.1
  socket_io_client: ^2.0.3+1

  # Routing
  go_router: ^14.0.2

  # Serialization
  json_annotation: ^4.8.1

  # Internationalization
  intl: ^0.19.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.15

  # Authentication
  google_sign_in: ^6.2.1

  # Media
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Storage
  flutter_secure_storage: ^9.0.0

  # Location & Maps
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.0

  # UI Components
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  google_fonts: ^6.2.1

  # Core Flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
